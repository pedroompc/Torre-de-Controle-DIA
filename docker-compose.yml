version: '3.8'

services:

  # ── Torre de Controle Logística ─────────────────────────────────────────────
  torre-controle:
    build: .
    container_name: torre-controle
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./app/logs:/app/app/logs
    depends_on:
      - evolution-api
    networks:
      - torre-network

  # ── Evolution API (WhatsApp) ─────────────────────────────────────────────────
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://torre-controle:8001/whatsapp/webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - CONFIG_SESSION_PHONE_CLIENT=Torre Controle DIA
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - LOG_LEVEL=ERROR
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - torre-network

networks:
  torre-network:
    driver: bridge

volumes:
  evolution_data:
